name: ArXiv-to-Code CI & Self-Test Suite

on:
  push:
    branches: [main, "pr/solo-*"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python 3.12 Pytest, 9-Step Self-Test & LLM Verifier CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest

      - name: Run 9-Step Functional Self-Test Suite
        run: |
          python arixv_to_code.py --test

      - name: Run Pytest Verification Suite
        run: |
          python arixv_to_code.py --pytest

      - name: Verify Organized Workspace + Evolution + LLM Verifier CLI
        run: |
          python arixv_to_code.py --arxiv-id 2608.15888 --evolves --evolve-count 2 --generations 2 --islands 2 --verify-llm --no-progress
          test -f generated/INDEX.md
          test -f generated/MANIFEST.json
