name: ArXiv-to-Code CI & Self-Test Suite

on:
  push:
    branches: [main, "pr/solo-*"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python 3.12 Pytest & 8-Step Self-Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest

      - name: Run 8-Step Functional Self-Test Suite
        run: |
          python cli.py --test

      - name: Run Pytest Verification Suite
        run: |
          pytest -v tests/
